[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uibe-lecture-mcp"
version = "0.2.4"
description = "成长惠园课程抓取、规则筛选、后台报名和 Codex MCP"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.28,<0.29", "beautifulsoup4>=4.12,<5", "mcp>=1.20,<2", "playwright>=1.50,<2"]

[project.scripts]
uibe-lecture = "uibe_lecture.cli:main"

[tool.setuptools.packages.find]
include = ["uibe_lecture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


